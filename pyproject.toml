[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drumtab"
version = "0.1.0"
description = "Drum tabs from YouTube: yt-dlp -> Demucs -> ADTOF -> MIDI -> tab"
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3",          # pure-python MIDI parsing (core renderer)
    "yt-dlp>=2024.1",     # stage 1
    "demucs>=4.0",        # stage 2 (pulls torch)
]

[project.optional-dependencies]
# ADT backend — pick one. pytorch flavour is easiest, esp. on Apple Silicon.
adt = ["adtof @ git+https://github.com/xavriley/ADTOF-pytorch"]
notation = ["music21>=9.1"]        # MusicXML export (PDF also needs MuseScore CLI)
lyrics = ["openai-whisper>=20231117"]  # timed-word overlay from the vocal stem
agent = ["mcp[cli]>=1.2"]          # MCP server for Claude Desktop/Code/Cowork
dev = ["pytest>=8"]
# NB: PDF export additionally needs the MuseScore app/CLI on PATH (not a pip dep).

[project.scripts]
drumtab = "drumtab.cli:main"

[tool.setuptools.packages.find]
include = ["drumtab*", "agent*"]
